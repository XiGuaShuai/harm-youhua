# maidun.chujingservice.com → 后台容器(127.0.0.1:8787)
# 安装见 DEPLOY.md;装前会先备份原 maidun 配置,并用 nginx -t 校验后再 reload。
server {
    listen 80;
    listen [::]:80;
    server_name maidun.chujingservice.com;

    # 配置 PUT 可能较大(黑名单/应用列表),放宽到 8m,与后端 express.json 4m 上限匹配有余
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后台触发离线包构建(/api/admin/bundles/*/build|update)可能跑数分钟,放宽超时避免 504
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}
